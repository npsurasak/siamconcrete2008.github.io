<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2ECE2"/>
      <stop offset="1" stop-color="#E6DCCB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="340" rx="210" ry="22" fill="#2B2824" opacity="0.08"/>
  <!-- drill -->
  <g>
    <rect x="120" y="150" width="170" height="76" rx="20" fill="#4C555F"/>
    <rect x="120" y="150" width="170" height="22" rx="11" fill="#5C656F"/>
    <rect x="286" y="166" width="44" height="44" rx="8" fill="#3A424B"/>
    <rect x="330" y="180" width="66" height="14" rx="7" fill="#8E959E"/>
    <rect x="150" y="222" width="52" height="96" rx="14" fill="#4C555F"/>
    <rect x="150" y="222" width="52" height="20" fill="#E05A1E"/>
    <rect x="142" y="308" width="68" height="26" rx="9" fill="#3A424B"/>
    <circle cx="132" cy="188" r="7" fill="#E05A1E"/>
  </g>
  <!-- hammer -->
  <g transform="rotate(18 470 240)">
    <rect x="452" y="130" width="80" height="42" rx="10" fill="#3A3F45"/>
    <rect x="444" y="136" width="20" height="30" rx="6" fill="#2E3338"/>
    <rect x="478" y="170" width="26" height="160" rx="12" fill="#C89A62"/>
    <rect x="478" y="298" width="26" height="32" rx="12" fill="#B0824E"/>
  </g>
  <!-- screwdriver -->
  <g transform="rotate(-32 360 300)">
    <rect x="346" y="230" width="30" height="76" rx="12" fill="#E05A1E"/>
    <rect x="352" y="230" width="6" height="76" fill="#C24E18"/>
    <rect x="356" y="306" width="10" height="70" rx="4" fill="#8E959E"/>
  </g>
</svg>
